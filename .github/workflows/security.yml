# Third-party actions are pinned to a full 40-char commit SHA, never to a
# mutable tag like `@v2`. A tag can be force-moved by whoever owns the action
# (or by whoever compromises that account), and a moved tag would run attacker
# code with this workflow's GITHUB_TOKEN — that is exactly how the
# tj-actions/changed-files compromise spread. A SHA cannot be re-pointed.
#
# To update a pin:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# then replace the SHA and update the trailing `# vN` comment to match. Bumping
# the trailing comment across a MAJOR version (v1 -> v2) is a breaking change,
# not a pin refresh — read that action's release notes first.
name: Security

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  push:
    branches: [master, main, dev, "release-*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the audit job widens this to exactly what
# rustsec/audit-check needs.
permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes a check run, and on non-PR events (schedule,
    # push) opens an issue per advisory. Those are the only extra scopes it needs.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cargo-audit
        # v2 (was v1, whose node16 runtime GitHub has deprecated). v2's inputs
        # are `token` (still required), `ignore` and `working-directory`; this
        # call site only uses `token`, so nothing else needed adjusting.
        uses: rustsec/audit-check@e9159ac5f7d7d873ce074ca134da2f445c0a4a61 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned toolchain (from rust-toolchain.toml)
        # Honors rust-toolchain.toml instead of exporting RUSTUP_TOOLCHAIN and
        # floating on latest stable.
        run: |
          rustup toolchain install --no-self-update || rustup show
          rustup show active-toolchain

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
          log-level: warn
