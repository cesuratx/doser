# Cross-compilation CI for release artifacts
#
# Third-party actions are pinned to a full 40-char commit SHA, never to a
# mutable tag like `@v2`. A tag can be force-moved by whoever owns the action
# (or by whoever compromises that account), and a moved tag would run attacker
# code with this workflow's GITHUB_TOKEN — which here has `contents: write` and
# can rewrite published release assets. A SHA cannot be re-pointed.
#
# To update a pin:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# then replace the SHA and update the trailing `# vN` comment to match. Bumping
# the trailing comment across a MAJOR version (v1 -> v2) is a breaking change,
# not a pin refresh — read that action's release notes first.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Least privilege by default; only the jobs that publish the release widen it.
permissions:
  contents: read

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Get version from tag
        id: get_version
        # `workflow_dispatch` can be run against a branch as well as a tag. On a
        # branch GITHUB_REF is `refs/heads/<name>`, so the `refs/tags/v` strip
        # below is a no-op and the release would be published as
        # "Release refs/heads/master" against the branch name. Fail loudly
        # instead — dispatching against a tag ref still works.
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::Release must run on a v*.*.* tag ref, got '$GITHUB_REF'"
              exit 1
              ;;
          esac
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Create Release
        # v2 (was v1, whose node16 runtime GitHub has deprecated). The `name`,
        # `draft` and `prerelease` inputs are unchanged in v2; the token moved
        # from the `GITHUB_TOKEN` env var to a first-class `token:` input that
        # defaults to `${{ github.token }}`, so it is passed explicitly here.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

  build-binaries:
    name: build-${{ matrix.target }}
    needs: create-release
    permissions:
      contents: write # uploads tarballs/checksums as release assets
    strategy:
      matrix:
        include:
          # x86_64 Linux: intentionally simulation-only. There is no GPIO on a
          # desktop/CI x86 box, so this is the "try it without a Pi" artifact.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: ""
          # aarch64 Linux == the Raspberry Pi artifact. It MUST be built with
          # `--features hardware`, otherwise it ships the simulation backend and
          # reports successful doses on a Pi while never touching the HX711 or
          # moving the motor.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            features: "--features hardware"
          # macOS: rppal is Linux-only, so the `hardware` feature cannot be
          # built here. These are simulation binaries by necessity.
          - target: x86_64-apple-darwin
            os: macos-latest
            features: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned toolchain (from rust-toolchain.toml)
        # Released binaries must be built with the version pinned in
        # rust-toolchain.toml, not whatever "stable" happens to be that day.
        run: |
          rustup toolchain install --no-self-update || rustup show
          rustup show active-toolchain
          cargo --version

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux only)
        if: matrix.os == 'ubuntu-latest'
        # Pin to a released tag for reproducible release builds.
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build (cross)
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --target ${{ matrix.target }} -p doser_cli ${{ matrix.features }}

      - name: Build (cargo)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --target ${{ matrix.target }} -p doser_cli ${{ matrix.features }}

      - name: Strip binary
        # The package is `doser_cli`, so the produced binary is named `doser_cli`.
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            docker run --rm -v $(pwd):/work -w /work ubuntu:20.04 strip target/${{ matrix.target }}/release/doser_cli || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            strip target/${{ matrix.target }}/release/doser_cli || true
          fi

      - name: Create tarball and checksum
        run: |
          cd target/${{ matrix.target }}/release
          tar czf doser-${{ matrix.target }}.tar.gz doser_cli
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum doser-${{ matrix.target }}.tar.gz > doser-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 doser-${{ matrix.target }}.tar.gz > doser-${{ matrix.target }}.tar.gz.sha256
          fi
          cd ../../..

      - name: Upload Release Asset
        # v2 (was v1/node16). `files` keeps the same newline-delimited-globs
        # contract; the token moved from the `GITHUB_TOKEN` env var to a
        # `token:` input, so it is passed explicitly here.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Without this a glob that matches nothing still succeeds, so a release
          # could be published with zero artifacts and still report green.
          fail_on_unmatched_files: true
          files: |
            target/${{ matrix.target }}/release/doser-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/doser-${{ matrix.target }}.tar.gz.sha256
